<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>glitch - Servers</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-input: #f0f0f0;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --accent: #000000;
            --accent-hover: #333333;
            --border: #e0e0e0;
            --shadow: rgba(0, 0, 0, 0.08);
            --error: #ff4757;
            --success: #00d4aa;
            --warning: #ffa502;
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2a2a2a;
            --bg-input: #333333;
            --text-primary: #ffffff;
            --text-secondary: #999999;
            --accent: #ffffff;
            --accent-hover: #cccccc;
            --border: #333333;
            --shadow: rgba(255, 255, 255, 0.08);
        }

        [data-accent="blue"] { --accent: #0066ff; --accent-hover: #0052cc; }
        [data-accent="green"] { --accent: #00cc66; --accent-hover: #00a352; }
        [data-accent="red"] { --accent: #ff3333; --accent-hover: #cc0000; }
        [data-accent="purple"] { --accent: #9933ff; --accent-hover: #7a00cc; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--accent);
            color: var(--bg-primary);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--shadow);
            z-index: 2000;
            animation: slideIn 0.3s ease;
            font-weight: 500;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .welcome-screen, .auth-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 300;
        }

        .auth-screen { display: none; z-index: 100; }

        .welcome-container, .auth-container {
            background: var(--bg-primary);
            border-radius: 30px;
            padding: 50px 40px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 60px var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
        }

        .welcome-logo, .auth-logo {
            font-family: 'Pacifico', cursive;
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .welcome-tagline, .auth-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .language-selector { margin-bottom: 30px; }

        .language-select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--accent);
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }

        .continue-button, .auth-button {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            width: 100%;
        }

        .continue-button:hover, .auth-button:hover { background: var(--accent-hover); }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 5px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
        }

        .auth-tab.active { background: var(--accent); color: var(--bg-primary); }

        .auth-form { display: flex; flex-direction: column; gap: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; text-align: left; }
        .form-label { font-size: 0.8rem; font-weight: 600; color: var(--text-primary); }

        .form-input {
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: var(--bg-input);
            color: var(--text-primary);
            width: 100%;
        }

        .form-input:focus { outline: none; border-color: var(--accent); }

        .back-to-welcome {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: var(--accent);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            background: none;
            border: none;
            width: 100%;
            font-family: 'Inter', sans-serif;
        }

        .home-screen {
            display: none;
            height: 100%;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .home-screen.active { display: flex; }

        .home-header {
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid var(--border);
        }

        .home-logo {
            font-family: 'Pacifico', cursive;
            font-size: 2rem;
            color: var(--accent);
            cursor: pointer;
            background: none;
            border: none;
        }

        .home-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .home-title {
            font-family: 'Pacifico', cursive;
            font-size: 5rem;
            color: var(--accent);
        }

        .bottom-nav {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-primary);
            border-radius: 25px;
            box-shadow: 0 8px 30px var(--shadow);
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px 18px;
            z-index: 50;
            border: 1px solid var(--border);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 12px;
            color: var(--text-secondary);
            background: none;
            border: none;
        }

        .nav-icon { font-size: 1.4rem; }
        .nav-label { font-size: 0.7rem; font-weight: 600; }

        .nav-g-logo {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Pacifico', cursive;
            font-size: 1.4rem;
            cursor: pointer;
            border: none;
        }

        .globe-fab {
            position: fixed;
            bottom: 85px;
            left: 25px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px var(--shadow);
            z-index: 40;
            font-size: 1.2rem;
        }

        .settings-fab {
            position: fixed;
            bottom: 85px;
            right: 25px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px var(--shadow);
            z-index: 40;
            font-size: 1.1rem;
        }

        .servers-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .servers-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        .servers-content-modal {
            position: relative;
            background: var(--bg-primary);
            border-radius: 20px;
            padding: 25px;
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .server-option-card {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            border: 2px solid var(--border);
            transition: all 0.3s;
            position: relative;
        }

        .server-option-card:hover { border-color: var(--accent); }
        .server-option-card.active { border-color: var(--accent); background: var(--bg-input); }
        .server-option-card.full { opacity: 0.5; cursor: not-allowed; }

        .server-option-name { font-weight: 700; font-size: 1rem; }
        .server-option-desc { font-size: 0.8rem; color: var(--text-secondary); margin-top: 5px; }
        
        .server-capacity {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .capacity-bar {
            flex: 1;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }

        .capacity-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.3s;
        }

        .capacity-text {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .chat-screen {
            display: none;
            height: 100%;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .chat-screen.active { display: flex; }

        .screen-header {
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid var(--border);
        }

        .back-button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            color: var(--accent);
        }

        .header-logo {
            font-family: 'Pacifico', cursive;
            font-size: 1.8rem;
            color: var(--accent);
            cursor: pointer;
            background: none;
            border: none;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 90px;
        }

        .message { margin-bottom: 15px; display: flex; flex-direction: column; }
        .message-content {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 0.9rem;
        }
        .message-sent { align-items: flex-end; }
        .message-sent .message-content { background: var(--accent); color: var(--bg-primary); }
        .message-received { align-items: flex-start; }
        .message-received .message-content { background: var(--bg-secondary); color: var(--text-primary); }
        .message-meta { font-size: 0.65rem; color: var(--text-secondary); margin-top: 3px; }

        .input-container {
            padding: 15px 20px;
            padding-bottom: 85px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 10px 16px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            resize: none;
            min-height: 40px;
        }

        .send-button {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            border-radius: 20px;
            padding: 0 18px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .settings-screen, .profile-screen {
            display: none;
            height: 100%;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .settings-screen.active, .profile-screen.active { display: flex; }

        .settings-content, .profile-content {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            max-width: 450px;
            margin: 0 auto;
            width: 100%;
        }

        .settings-section {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }

        .settings-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .settings-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .toggle-switch {
            position: relative;
            width: 45px;
            height: 24px;
            background: var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .toggle-switch.active { background: var(--accent); }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 3px; left: 3px;
            width: 18px; height: 18px;
            background: white;
            border-radius: 50%;
            transition: all 0.3s;
        }
        .toggle-switch.active::after { left: 24px; }

        .color-options { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .color-option {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--border);
        }
        .color-option.active { border-color: var(--accent); }

        .profile-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 3px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            overflow: hidden;
            cursor: pointer;
            font-size: 2.5rem;
        }

        .profile-info-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: var(--bg-secondary);
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .phone-screen {
            display: none;
            height: 100%;
            flex-direction: column;
            background: var(--bg-primary);
        }
        .phone-screen.active { display: flex; }

        .dialer-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            padding-bottom: 90px;
        }

        .dialer-display {
            width: 280px;
            height: 50px;
            background: var(--bg-secondary);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--accent);
        }

        .dialer-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }

        .dialer-button {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            background: var(--bg-primary);
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent);
        }

        .dialer-actions { display: flex; gap: 25px; }
        .call-button, .clear-button {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
        }
        .call-button { background: var(--accent); color: var(--bg-primary); }
        .clear-button { background: #ff4757; color: white; }
    </style>
</head>
<body>
    <!-- Welcome Screen -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-container">
            <div class="welcome-logo">glitch</div>
            <div class="welcome-tagline">Your Chat Experience</div>
            <div class="language-selector">
                <select class="language-select" id="languageSelect">
                    <option value="pt">🇧🇷 Português</option>
                    <option value="en">🇺🇸 English</option>
                </select>
            </div>
            <button class="continue-button" id="continueButton" type="button">Continue</button>
        </div>
    </div>

    <!-- Auth Screen -->
    <div class="auth-screen" id="authScreen">
        <div class="auth-container">
            <div class="auth-logo">glitch</div>
            <div class="auth-subtitle">Your Chat Experience</div>
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login" type="button">Login</button>
                <button class="auth-tab" data-tab="register" type="button">Register</button>
            </div>
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-input" id="loginUsername" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="Enter password">
                </div>
                <button type="submit" class="auth-button">Login</button>
            </form>
            <form class="auth-form" id="registerForm" style="display:none;">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-input" id="registerUsername" placeholder="Choose username">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="registerPassword" placeholder="Create password">
                </div>
                <button type="submit" class="auth-button">Register</button>
            </form>
            <button class="back-to-welcome" id="backToWelcome" type="button">← Back</button>
        </div>
    </div>

    <!-- Home Screen -->
    <div class="home-screen" id="homeScreen">
        <div class="home-header">
            <button class="home-logo" id="homeLogoSettings" type="button">glitch</button>
        </div>
        <div class="home-content">
            <div class="home-title">glitch</div>
        </div>
        <div class="bottom-nav">
            <button class="nav-item" id="phoneOption" type="button"><span class="nav-icon">📞</span><span class="nav-label">Phone</span></button>
            <button class="nav-g-logo" id="navGLogo" type="button">g</button>
            <button class="nav-item" id="chatOption" type="button"><span class="nav-icon">💬</span><span class="nav-label">Chat</span></button>
        </div>
        <button class="globe-fab" id="globeFab" type="button">🌐</button>
        <button class="settings-fab" id="settingsFab" type="button">⚙️</button>
    </div>

    <!-- Servers Modal -->
    <div class="servers-modal" id="serversModal">
        <div class="servers-overlay" id="serversOverlay"></div>
        <div class="servers-content-modal">
            <div style="font-family:'Pacifico',cursive;font-size:1.5rem;color:var(--accent);margin-bottom:20px;text-align:center;">Select Server</div>
            <div class="server-option-card" data-server="server1" id="server1Card">
                <div class="server-option-name">🌍 Global Server</div>
                <div class="server-option-desc">Chat global - Máx 6 participantes</div>
                <div class="server-capacity">
                    <div class="capacity-bar"><div class="capacity-fill" id="server1Fill" style="width:0%"></div></div>
                    <span class="capacity-text" id="server1Text">0/6</span>
                </div>
            </div>
            <div class="server-option-card" data-server="server2" id="server2Card">
                <div class="server-option-name">🇪🇺 Europe Server</div>
                <div class="server-option-desc">Chat europeu - Máx 6 participantes</div>
                <div class="server-capacity">
                    <div class="capacity-bar"><div class="capacity-fill" id="server2Fill" style="width:0%"></div></div>
                    <span class="capacity-text" id="server2Text">0/6</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div class="chat-screen" id="chatScreen">
        <div class="screen-header">
            <button class="back-button" id="chatBackButton" type="button">←</button>
            <button class="header-logo" id="chatLogoSettings" type="button">glitch</button>
            <span id="currentServerName" style="font-size:0.8rem;color:var(--text-secondary);"></span>
        </div>
        <div class="chat-container" id="chatContainer">
            <div class="message message-received"><div class="message-content">Welcome to the server!</div><div class="message-meta">system</div></div>
        </div>
        <div class="input-container">
            <textarea class="message-input" id="messageInput" placeholder="Type..."></textarea>
            <button class="send-button" id="sendButton" type="button">Send</button>
        </div>
    </div>

    <!-- Phone Screen -->
    <div class="phone-screen" id="phoneScreen">
        <div class="screen-header">
            <button class="back-button" id="phoneBackButton" type="button">←</button>
            <button class="header-logo" type="button">glitch</button>
        </div>
        <div class="dialer-container">
            <div class="dialer-display" id="dialerDisplay"></div>
            <div class="dialer-pad" id="dialerPad"></div>
            <div class="dialer-actions">
                <button class="call-button" id="callButton" type="button">📞</button>
                <button class="clear-button" id="clearButton" type="button">✕</button>
            </div>
        </div>
    </div>

    <!-- Settings Screen -->
    <div class="settings-screen" id="settingsScreen">
        <div class="screen-header">
            <button class="back-button" id="settingsBackButton" type="button">←</button>
            <button class="header-logo" type="button">glitch</button>
        </div>
        <div class="settings-content">
            <div class="settings-section">
                <div class="settings-title">Appearance</div>
                <div class="settings-item"><span>Dark Mode</span><div class="toggle-switch" id="darkModeToggle"></div></div>
                <div class="settings-item"><span>Accent Color</span></div>
                <div class="color-options">
                    <div class="color-option" data-color="black" style="background:#000;"></div>
                    <div class="color-option" data-color="blue" style="background:#06f;"></div>
                    <div class="color-option" data-color="green" style="background:#0c6;"></div>
                    <div class="color-option" data-color="red" style="background:#f33;"></div>
                    <div class="color-option" data-color="purple" style="background:#93f;"></div>
                </div>
            </div>
            <div class="settings-section">
                <div class="settings-title">Account</div>
                <div class="settings-item"><span>Logout</span><button class="back-button" id="settingsLogoutButton">→</button></div>
            </div>
        </div>
    </div>

    <!-- Profile Screen -->
    <div class="profile-screen" id="profileScreen">
        <div class="screen-header">
            <button class="back-button" id="profileBackButton" type="button">←</button>
            <button class="header-logo" type="button">glitch</button>
        </div>
        <div class="profile-content">
            <div style="text-align:center;margin-bottom:20px;">
                <div class="profile-photo" id="profilePhotoDisplay">👤</div>
            </div>
            <div class="profile-info-item"><span>Name</span><span id="profileNameValue">-</span></div>
            <div class="profile-info-item"><span>Username</span><span id="profileUsernameValue">-</span></div>
            <div class="profile-info-item"><span>Server</span><span id="profileServerValue">-</span></div>
        </div>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        
        // Server state
        const MAX_PARTICIPANTS = 6;
        let currentUser = JSON.parse(localStorage.getItem('cu') || 'null');
        let selectedServer = localStorage.getItem('selectedServer') || 'server1';
        let ws = null;
        
        // Get server participants from localStorage
        function getServerParticipants(serverId) {
            return JSON.parse(localStorage.getItem('server_' + serverId) || '[]');
        }
        
        // Save server participants
        function saveServerParticipants(serverId, participants) {
            localStorage.setItem('server_' + serverId, JSON.stringify(participants));
        }
        
        // Join server
        function joinServer(serverId) {
            if (!currentUser) {
                alert('Please login first');
                return;
            }
            
            const participants = getServerParticipants(serverId);
            
            // Check if already in server
            if (participants.includes(currentUser.username)) {
                return true;
            }
            
            // Check if server is full
            if (participants.length >= MAX_PARTICIPANTS) {
                alert('Server is full! Maximum ' + MAX_PARTICIPANTS + ' participants.');
                return false;
            }
            
            // First participant becomes admin
            if (participants.length === 0) {
                participants.push({ username: currentUser.username, role: 'admin', name: currentUser.name || currentUser.username });
            } else {
                participants.push({ username: currentUser.username, role: 'member', name: currentUser.name || currentUser.username });
            }
            
            saveServerParticipants(serverId, participants);
            updateServerUI();
            return true;
        }
        
        // Leave server
        function leaveServer(serverId) {
            if (!currentUser) return;
            
            let participants = getServerParticipants(serverId);
            participants = participants.filter(p => p.username !== currentUser.username);
            
            // If admin left, promote next person
            if (participants.length > 0 && !participants.some(p => p.role === 'admin')) {
                participants[0].role = 'admin';
            }
            
            saveServerParticipants(serverId, participants);
            updateServerUI();
        }
        
        // Update server UI (capacity bars)
        function updateServerUI() {
            ['server1', 'server2'].forEach(serverId => {
                const participants = getServerParticipants(serverId);
                const count = participants.length;
                const fillPercent = (count / MAX_PARTICIPANTS) * 100;
                
                const fillEl = $(serverId + 'Fill');
                const textEl = $(serverId + 'Text');
                const cardEl = $(serverId + 'Card');
                
                if (fillEl) fillEl.style.width = fillPercent + '%';
                if (textEl) textEl.textContent = count + '/' + MAX_PARTICIPANTS;
                
                if (cardEl) {
                    if (count >= MAX_PARTICIPANTS) {
                        cardEl.classList.add('full');
                    } else {
                        cardEl.classList.remove('full');
                    }
                }
            });
        }
        
        // Show screen
        function showScreen(screenId) {
            $('welcomeScreen').style.display = 'none';
            $('authScreen').style.display = 'none';
            $('serversModal').style.display = 'none';
            ['homeScreen', 'phoneScreen', 'chatScreen', 'settingsScreen', 'profileScreen'].forEach(id => {
                $(id).classList.remove('active');
            });
            
            if (screenId === 'welcome') $('welcomeScreen').style.display = 'flex';
            else if (screenId === 'auth') $('authScreen').style.display = 'flex';
            else if (screenId === 'home') $('homeScreen').classList.add('active');
            else if (screenId === 'phone') $('phoneScreen').classList.add('active');
            else if (screenId === 'chat') {
                $('chatScreen').classList.add('active');
                connectToServer();
            }
            else if (screenId === 'settings') $('settingsScreen').classList.add('active');
            else if (screenId === 'profile') {
                $('profileScreen').classList.add('active');
                updateProfileUI();
            }
        }
        
        // Connect to WebSocket
        function connectToServer() {
            if (ws) ws.close();
            
            const serverUrls = {
                server1: 'wss://echo.websocket.org',
                server2: 'wss://ws.postman-echo.com/raw'
            };
            
            $('currentServerName').textContent = selectedServer === 'server1' ? '🌍 Global' : '🇪🇺 Europe';
            
            try {
                ws = new WebSocket(serverUrls[selectedServer]);
                
                ws.onopen = function() {
                    console.log('Connected to', selectedServer);
                    if (currentUser) {
                        ws.send(JSON.stringify({
                            type: 'join',
                            server: selectedServer,
                            user: currentUser.username
                        }));
                    }
                };
                
                ws.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.content) {
                            displayMessage(data.content, false, data.sender);
                        }
                    } catch(e) {
                        displayMessage(event.data, false, 'Server');
                    }
                };
                
                ws.onclose = function() {
                    console.log('Disconnected');
                    if (currentUser) leaveServer(selectedServer);
                };
            } catch(e) {
                console.error('Connection error:', e);
            }
        }
        
        // Send message
        function sendMessage() {
            const content = $('messageInput').value.trim();
            if (!content) return;
            
            displayMessage(content, true);
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'message',
                    server: selectedServer,
                    content: content,
                    sender: currentUser?.name || currentUser?.username || 'Anonymous'
                }));
            }
            
            $('messageInput').value = '';
        }
        
        // Display message
        function displayMessage(content, sent, sender = null) {
            const div = document.createElement('div');
            div.className = 'message ' + (sent ? 'message-sent' : 'message-received');
            div.innerHTML = '<div class="message-content">' + content + '</div><div class="message-meta">' + (sent ? 'You' : sender || 'Peer') + '</div>';
            $('chatContainer').appendChild(div);
            $('chatContainer').scrollTop = $('chatContainer').scrollHeight;
        }
        
        // Update profile
        function updateProfileUI() {
            if (currentUser) {
                $('profileNameValue').textContent = currentUser.name || currentUser.username;
                $('profileUsernameValue').textContent = '@' + currentUser.username;
                $('profileServerValue').textContent = selectedServer === 'server1' ? '🌍 Global' : '🇪🇺 Europe';
            }
        }
        
        // Continue button
        $('continueButton').addEventListener('click', function() {
            $('welcomeScreen').style.display = 'none';
            $('authScreen').style.display = 'flex';
        });
        
        // Back to welcome
        $('backToWelcome').addEventListener('click', function() {
            $('authScreen').style.display = 'none';
            $('welcomeScreen').style.display = 'flex';
        });
        
        // Auth tabs
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                $('loginForm').style.display = this.dataset.tab === 'login' ? 'flex' : 'none';
                $('registerForm').style.display = this.dataset.tab === 'register' ? 'flex' : 'none';
            });
        });
        
        // Login
        $('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = $('loginUsername').value.trim();
            const password = $('loginPassword').value;
            
            if (!username || !password) { alert('Fill all fields'); return; }
            
            const users = JSON.parse(localStorage.getItem('gu') || '{}');
            const user = users[username];
            
            if (!user) { alert('User not found'); return; }
            if (user.password !== password) { alert('Invalid password'); return; }
            
            currentUser = { username, ...user };
            localStorage.setItem('cu', JSON.stringify(currentUser));
            $('loginForm').reset();
            showScreen('home');
        });
        
        // Register
        $('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = $('registerUsername').value.trim();
            const password = $('registerPassword').value;
            
            if (!username) { alert('Username required'); return; }
            
            const users = JSON.parse(localStorage.getItem('gu') || '{}');
            if (users[username]) { alert('Username exists'); return; }
            if (!password || password.length < 6) { alert('Password min 6 chars'); return; }
            
            users[username] = { password, name: username, completed: true };
            localStorage.setItem('gu', JSON.stringify(users));
            $('registerForm').reset();
            
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelector('[data-tab="login"]').classList.add('active');
            $('loginForm').style.display = 'flex';
            $('registerForm').style.display = 'none';
            $('loginUsername').value = username;
            
            alert('Account created! Please login.');
        });
        
        // Navigation
        $('phoneOption').addEventListener('click', () => showScreen('phone'));
        $('chatOption').addEventListener('click', () => showScreen('chat'));
        $('phoneBackButton').addEventListener('click', () => showScreen('home'));
        $('chatBackButton').addEventListener('click', () => {
            if (ws) ws.close();
            if (currentUser) leaveServer(selectedServer);
            showScreen('home');
        });
        $('settingsFab').addEventListener('click', () => showScreen('settings'));
        $('settingsBackButton').addEventListener('click', () => showScreen('home'));
        $('profileBackButton').addEventListener('click', () => showScreen('home'));
        $('homeLogoSettings').addEventListener('click', () => showScreen('profile'));
        $('chatLogoSettings').addEventListener('click', () => showScreen('profile'));
        $('navGLogo').addEventListener('click', () => showScreen('profile'));
        
        // Globe button
        $('globeFab').addEventListener('click', function() {
            updateServerUI();
            $('serversModal').style.display = 'flex';
        });
        
        // Close servers modal
        $('serversOverlay').addEventListener('click', function() {
            $('serversModal').style.display = 'none';
        });
        
        // Server selection
        document.querySelectorAll('.server-option-card').forEach(card => {
            card.addEventListener('click', function() {
                const serverId = this.dataset.server;
                const participants = getServerParticipants(serverId);
                
                if (participants.length >= MAX_PARTICIPANTS && !participants.includes(currentUser?.username)) {
                    alert('Server is full! Maximum ' + MAX_PARTICIPANTS + ' participants.');
                    return;
                }
                
                // Leave old server
                if (selectedServer && selectedServer !== serverId) {
                    leaveServer(selectedServer);
                }
                
                selectedServer = serverId;
                localStorage.setItem('selectedServer', selectedServer);
                
                // Join new server
                joinServer(serverId);
                
                document.querySelectorAll('.server-option-card').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                
                const serverName = this.querySelector('.server-option-name').textContent;
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = '✓ Joined ' + serverName;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
                
                setTimeout(() => {
                    $('serversModal').style.display = 'none';
                }, 500);
            });
        });
        
        // Chat
        $('sendButton').addEventListener('click', sendMessage);
        $('messageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
        
        // Settings
        $('darkModeToggle').addEventListener('click', function() {
            this.classList.toggle('active');
            const isDark = this.classList.contains('active');
            if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
            else document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('gdm', isDark);
        });
        
        document.querySelectorAll('.color-option').forEach(opt => {
            opt.addEventListener('click', function() {
                document.querySelectorAll('.color-option').forEach(o => o.classList.remove('active'));
                this.classList.add('active');
                const color = this.dataset.color;
                if (color !== 'black') document.documentElement.setAttribute('data-accent', color);
                else document.documentElement.removeAttribute('data-accent');
                localStorage.setItem('gac', color);
            });
        });
        
        $('settingsLogoutButton').addEventListener('click', function() {
            if (ws) ws.close();
            if (currentUser) leaveServer(selectedServer);
            localStorage.removeItem('cu');
            currentUser = null;
            showScreen('auth');
        });
        
        // Dialer
        let phoneNumber = '';
        ['1','2','3','4','5','6','7','8','9','*','0','#'].forEach(n => {
            const btn = document.createElement('button');
            btn.className = 'dialer-button';
            btn.textContent = n;
            btn.addEventListener('click', () => {
                phoneNumber += n;
                $('dialerDisplay').textContent = phoneNumber;
            });
            $('dialerPad').appendChild(btn);
        });
        
        $('clearButton').addEventListener('click', () => { phoneNumber = ''; $('dialerDisplay').textContent = ''; });
        $('callButton').addEventListener('click', () => { if (phoneNumber) alert('Calling ' + phoneNumber + '...'); });
        
        // Initialize
        updateServerUI();
        
        if (currentUser) {
            showScreen('home');
        }
        
        // Load theme
        if (localStorage.getItem('gdm') === 'true') {
            document.documentElement.setAttribute('data-theme', 'dark');
            $('darkModeToggle')?.classList.add('active');
        }
        
        // Highlight selected server
        document.querySelectorAll('.server-option-card').forEach(card => {
            card.classList.toggle('active', card.dataset.server === selectedServer);
        });
        
        console.log('App initialized with 2 servers, max 6 participants each');
    </script>
</body>
</html>
