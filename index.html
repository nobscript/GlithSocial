<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>glitch - Servers</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-input: #f0f0f0;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --accent: #000000;
            --accent-hover: #333333;
            --border: #e0e0e0;
            --shadow: rgba(0, 0, 0, 0.08);
            --error: #ff4757;
            --success: #00d4aa;
            --warning: #ffa502;
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2a2a2a;
            --bg-input: #333333;
            --text-primary: #ffffff;
            --text-secondary: #999999;
            --accent: #ffffff;
            --accent-hover: #cccccc;
            --border: #333333;
            --shadow: rgba(255, 255, 255, 0.08);
        }

        [data-accent="blue"] { --accent: #0066ff; --accent-hover: #0052cc; }
        [data-accent="green"] { --accent: #00cc66; --accent-hover: #00a352; }
        [data-accent="red"] { --accent: #ff3333; --accent-hover: #cc0000; }
        [data-accent="purple"] { --accent: #9933ff; --accent-hover: #7a00cc; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--accent);
            color: var(--bg-primary);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--shadow);
            z-index: 2000;
            animation: slideIn 0.3s ease;
            font-weight: 500;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Servers Screen */
        .servers-screen {
            display: none;
            height: 100%;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .servers-screen.active {
            display: flex;
        }

        .screen-header {
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid var(--border);
        }

        .back-button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            color: var(--accent);
        }

        .header-title {
            font-family: 'Pacifico', cursive;
            font-size: 1.5rem;
            color: var(--accent);
        }

        .servers-content {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .server-card {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            border: 2px solid var(--border);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .server-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--shadow);
        }

        .server-card.active {
            border-color: var(--accent);
            background: var(--bg-input);
        }

        .server-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .server-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .server-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .badge-admin {
            background: var(--warning);
            color: #000;
        }

        .badge-member {
            background: var(--success);
            color: #fff;
        }

        .badge-pending {
            background: var(--error);
            color: #fff;
        }

        .server-info {
            display: flex;
            gap: 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .server-info span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Members list */
        .members-list {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        .member-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .member-item:hover {
            background: var(--bg-input);
        }

        .member-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .member-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .member-name {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .member-role {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        .role-admin {
            background: var(--warning);
            color: #000;
        }

        .role-member {
            background: var(--success);
            color: #fff;
        }

        /* Mini Popup */
        .mini-popup {
            position: fixed;
            z-index: 1500;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 10px 30px var(--shadow);
            padding: 10px;
            min-width: 150px;
            animation: popupIn 0.2s ease;
            display: none;
        }

        @keyframes popupIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .popup-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
            color: var(--text-primary);
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: 'Inter', sans-serif;
        }

        .popup-item:hover {
            background: var(--bg-secondary);
        }

        .popup-item.danger {
            color: var(--error);
        }

        .popup-item.danger:hover {
            background: #fff0f0;
        }

        /* Pending requests */
        .pending-section {
            margin-top: 15px;
            padding: 15px;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px dashed var(--border);
        }

        .pending-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .pending-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 5px;
            background: var(--bg-primary);
        }

        .pending-actions {
            display: flex;
            gap: 8px;
        }

        .accept-btn, .reject-btn {
            padding: 5px 12px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .accept-btn {
            background: var(--success);
            color: #fff;
        }

        .accept-btn:hover { opacity: 0.8; }

        .reject-btn {
            background: var(--error);
            color: #fff;
        }

        .reject-btn:hover { opacity: 0.8; }

        .join-btn {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .join-btn:hover { background: var(--accent-hover); }
    </style>
</head>
<body>
    <!-- Servers Screen -->
    <div class="servers-screen" id="serversScreen">
        <div class="screen-header">
            <button class="back-button" id="serversBackButton" type="button">←</button>
            <span class="header-title">glitch</span>
        </div>
        <div class="servers-content" id="serversContent">
            <!-- Server cards will be rendered here -->
        </div>
    </div>

    <!-- Mini Popup -->
    <div class="mini-popup" id="miniPopup">
        <button class="popup-item" id="popupKick" type="button">🚫 Expulsar</button>
        <button class="popup-item" id="popupPromote" type="button">👑 Tornar Admin</button>
        <button class="popup-item" id="popupMessage" type="button">💬 Mensagem</button>
        <button class="popup-item danger" id="popupBlock" type="button">⛔ Bloquear</button>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        
        // Server data stored in localStorage
        function getServers() {
            return JSON.parse(localStorage.getItem('glitchServers') || '{}');
        }

        function saveServers(servers) {
            localStorage.setItem('glitchServers', JSON.stringify(servers));
        }

        function getCurrentUser() {
            return JSON.parse(localStorage.getItem('cu') || 'null');
        }

        // Initialize servers if not exist
        function initServers() {
            const servers = getServers();
            
            const defaultServers = {
                'server1': {
                    id: 'server1',
                    name: '🌍 Global Server',
                    description: 'Servidor global para todos',
                    admin: null,
                    members: {},
                    pendingRequests: {},
                    createdAt: Date.now()
                },
                'server2': {
                    id: 'server2',
                    name: '🇪🇺 Europe Server',
                    description: 'Servidor europeu',
                    admin: null,
                    members: {},
                    pendingRequests: {},
                    createdAt: Date.now()
                },
                'server3': {
                    id: 'server3',
                    name: '🧪 Demo Server',
                    description: 'Servidor de demonstração',
                    admin: null,
                    members: {},
                    pendingRequests: {},
                    createdAt: Date.now()
                }
            };
            
            if (Object.keys(servers).length === 0) {
                saveServers(defaultServers);
            }
            
            return Object.keys(servers).length > 0 ? servers : defaultServers;
        }

        // Render servers
        function renderServers() {
            const servers = initServers();
            const currentUser = getCurrentUser();
            const container = $('serversContent');
            
            container.innerHTML = '';
            
            Object.values(servers).forEach(server => {
                const card = document.createElement('div');
                card.className = 'server-card';
                if (server.members[currentUser?.username]) {
                    card.classList.add('active');
                }
                
                const isAdmin = server.admin === currentUser?.username;
                const isMember = server.members[currentUser?.username];
                const isPending = server.pendingRequests[currentUser?.username];
                
                let badge = '';
                if (isAdmin) {
                    badge = '<span class="server-badge badge-admin">👑 Admin</span>';
                } else if (isMember) {
                    badge = '<span class="server-badge badge-member">✓ Member</span>';
                } else if (isPending) {
                    badge = '<span class="server-badge badge-pending">⏳ Pending</span>';
                } else {
                    badge = '<button class="join-btn" data-server="' + server.id + '">Join</button>';
                }
                
                const memberCount = Object.keys(server.members).length;
                
                card.innerHTML = `
                    <div class="server-card-header">
                        <span class="server-name">${server.name}</span>
                        ${badge}
                    </div>
                    <div class="server-info">
                        <span>👥 ${memberCount} members</span>
                        <span>📝 ${server.description}</span>
                    </div>
                `;
                
                // If user is member or admin, show members list
                if (isMember || isAdmin) {
                    const membersList = document.createElement('div');
                    membersList.className = 'members-list';
                    
                    Object.entries(server.members).forEach(([username, data]) => {
                        const memberItem = document.createElement('div');
                        memberItem.className = 'member-item';
                        memberItem.dataset.username = username;
                        memberItem.dataset.server = server.id;
                        
                        const role = username === server.admin ? 'Admin' : 'Member';
                        const roleClass = username === server.admin ? 'role-admin' : 'role-member';
                        
                        memberItem.innerHTML = `
                            <div class="member-info">
                                <div class="member-avatar">${data.name ? data.name.charAt(0).toUpperCase() : username.charAt(0).toUpperCase()}</div>
                                <span class="member-name">${data.name || username} ${username === currentUser?.username ? '(You)' : ''}</span>
                            </div>
                            <span class="member-role ${roleClass}">${role}</span>
                        `;
                        
                        // Only admin can click on other members
                        if (isAdmin && username !== currentUser?.username) {
                            memberItem.addEventListener('click', function(e) {
                                e.stopPropagation();
                                showMiniPopup(e, username, server.id);
                            });
                        }
                        
                        membersList.appendChild(memberItem);
                    });
                    
                    // Show pending requests for admin
                    if (isAdmin && Object.keys(server.pendingRequests).length > 0) {
                        const pendingSection = document.createElement('div');
                        pendingSection.className = 'pending-section';
                        pendingSection.innerHTML = '<div class="pending-title">⏳ Pending Requests</div>';
                        
                        Object.entries(server.pendingRequests).forEach(([username, data]) => {
                            const pendingItem = document.createElement('div');
                            pendingItem.className = 'pending-item';
                            pendingItem.innerHTML = `
                                <span style="font-size:0.85rem;">${data.name || username}</span>
                                <div class="pending-actions">
                                    <button class="accept-btn" data-server="${server.id}" data-username="${username}">Accept</button>
                                    <button class="reject-btn" data-server="${server.id}" data-username="${username}">Reject</button>
                                </div>
                            `;
                            pendingSection.appendChild(pendingItem);
                        });
                        
                        membersList.appendChild(pendingSection);
                    }
                    
                    card.appendChild(membersList);
                }
                
                container.appendChild(card);
            });
            
            // Add event listeners for join buttons
            document.querySelectorAll('.join-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    joinServer(this.dataset.server);
                });
            });
            
            // Add event listeners for accept/reject buttons
            document.querySelectorAll('.accept-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    acceptRequest(this.dataset.server, this.dataset.username);
                });
            });
            
            document.querySelectorAll('.reject-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    rejectRequest(this.dataset.server, this.dataset.username);
                });
            });
        }

        // Join server
        function joinServer(serverId) {
            const servers = getServers();
            const currentUser = getCurrentUser();
            
            if (!currentUser) {
                alert('Please login first');
                return;
            }
            
            const server = servers[serverId];
            
            if (!server) return;
            
            // First member becomes admin
            if (Object.keys(server.members).length === 0 && !server.admin) {
                server.admin = currentUser.username;
                server.members[currentUser.username] = {
                    name: currentUser.name,
                    joinedAt: Date.now()
                };
                showToast('You are now the Admin of ' + server.name + '! 👑');
            } else {
                // Add to pending requests
                server.pendingRequests[currentUser.username] = {
                    name: currentUser.name,
                    requestedAt: Date.now()
                };
                showToast('Request sent to join ' + server.name + ' ⏳');
            }
            
            saveServers(servers);
            renderServers();
        }

        // Accept request
        function acceptRequest(serverId, username) {
            const servers = getServers();
            const server = servers[serverId];
            
            if (server.pendingRequests[username]) {
                server.members[username] = {
                    name: server.pendingRequests[username].name,
                    joinedAt: Date.now()
                };
                delete server.pendingRequests[username];
                saveServers(servers);
                renderServers();
                showToast(username + ' accepted! ✓');
            }
        }

        // Reject request
        function rejectRequest(serverId, username) {
            const servers = getServers();
            const server = servers[serverId];
            
            if (server.pendingRequests[username]) {
                delete server.pendingRequests[username];
                saveServers(servers);
                renderServers();
                showToast(username + ' rejected');
            }
        }

        // Show mini popup
        function showMiniPopup(event, username, serverId) {
            const popup = $('miniPopup');
            popup.style.display = 'block';
            
            // Position popup near click
            const x = event.clientX;
            const y = event.clientY;
            
            popup.style.left = Math.min(x, window.innerWidth - 170) + 'px';
            popup.style.top = Math.min(y, window.innerHeight - 150) + 'px';
            
            // Store context
            popup.dataset.username = username;
            popup.dataset.server = serverId;
        }

        // Hide popup
        function hidePopup() {
            $('miniPopup').style.display = 'none';
        }

        // Kick member
        function kickMember(serverId, username) {
            const servers = getServers();
            const server = servers[serverId];
            
            if (server.members[username]) {
                delete server.members[username];
                saveServers(servers);
                renderServers();
                hidePopup();
                showToast(username + ' kicked from server 🚫');
            }
        }

        // Promote to admin
        function promoteMember(serverId, username) {
            const servers = getServers();
            const server = servers[serverId];
            const currentUser = getCurrentUser();
            
            if (server.admin === currentUser.username) {
                server.admin = username;
                saveServers(servers);
                renderServers();
                hidePopup();
                showToast(username + ' is now Admin 👑');
            }
        }

        // Block member
        function blockMember(serverId, username) {
            const servers = getServers();
            const server = servers[serverId];
            
            if (server.members[username]) {
                delete server.members[username];
                server.pendingRequests[username] = { blocked: true, name: username };
                saveServers(servers);
                renderServers();
                hidePopup();
                showToast(username + ' blocked ⛔');
            }
        }

        // Show toast
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            renderServers();
            
            // Hide popup on click elsewhere
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.mini-popup')) {
                    hidePopup();
                }
            });
            
            // Popup actions
            $('popupKick').addEventListener('click', function() {
                const popup = $('miniPopup');
                kickMember(popup.dataset.server, popup.dataset.username);
            });
            
            $('popupPromote').addEventListener('click', function() {
                const popup = $('miniPopup');
                promoteMember(popup.dataset.server, popup.dataset.username);
            });
            
            $('popupMessage').addEventListener('click', function() {
                const popup = $('miniPopup');
                alert('Message to ' + popup.dataset.username);
                hidePopup();
            });
            
            $('popupBlock').addEventListener('click', function() {
                const popup = $('miniPopup');
                blockMember(popup.dataset.server, popup.dataset.username);
            });
        });

        // For testing - create a test user
        if (!getCurrentUser()) {
            localStorage.setItem('cu', JSON.stringify({
                username: 'admin',
                name: 'Admin User',
                completed: true
            }));
        }

        console.log('Servers system initialized');
    </script>
</body>
</html>
