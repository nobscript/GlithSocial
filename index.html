<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glith - Chat Simples</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            background: #1a1a1a;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 20px;
        }

        .screen.active {
            display: flex;
        }

        .login-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 16px;
            padding: 20px;
        }

        .logo {
            text-align: center;
        }

        .logo .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 4px;
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13px;
            color: #aaa;
            font-weight: 500;
        }

        .id-display {
            background: #2a2a2a;
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
        }

        .id-display span {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #667eea;
            word-break: break-all;
        }

        input[type="text"] {
            background: #2a2a2a;
            border: 1px solid #333;
            padding: 12px 16px;
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 14px;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            background: #303030;
        }

        .btn-primary,
        .btn-secondary {
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: #667eea;
            border: 1px solid #667eea;
        }

        .btn-secondary:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .btn-icon:hover {
            background: #333;
            color: #e0e0e0;
        }

        .status {
            text-align: center;
            font-size: 13px;
            padding: 6px;
            border-radius: 8px;
            min-height: 30px;
        }

        .status.connected {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        .status.error {
            color: #f87171;
            background: rgba(248, 113, 113, 0.1);
        }

        .status.info {
            color: #60a5fa;
            background: rgba(96, 165, 250, 0.1);
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 12px;
        }

        .btn-back {
            background: transparent;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.3s;
        }

        .btn-back:hover {
            color: #e0e0e0;
        }

        .chat-info {
            flex: 1;
        }

        .chat-name {
            font-weight: 600;
            font-size: 16px;
            display: block;
        }

        .status-dot {
            font-size: 12px;
            color: #4ade80;
        }

        .status-dot.offline {
            color: #f87171;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .messages-container::-webkit-scrollbar {
            width: 4px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 2px;
        }

        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 14px;
            animation: slideIn 0.2s ease;
            word-wrap: break-word;
            position: relative;
        }

        .message .sender-name {
            font-size: 11px;
            font-weight: 600;
            opacity: 0.8;
            display: block;
            margin-bottom: 2px;
        }

        .message.sent {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            background: #2a2a2a;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message .time {
            font-size: 9px;
            opacity: 0.6;
            margin-top: 2px;
            display: block;
            text-align: right;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-area {
            display: flex;
            gap: 8px;
            padding: 12px 0;
            border-top: 1px solid #2a2a2a;
        }

        .input-area input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #e0e0e0;
            font-size: 14px;
        }

        .input-area input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-send {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-send:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-send:active {
            transform: scale(0.95);
        }

        @media (max-width: 480px) {
            .app {
                max-height: 100vh;
                border-radius: 0;
            }
        }

        .name-input-group {
            display: flex;
            gap: 8px;
        }

        .name-input-group input {
            flex: 1;
        }

        .name-input-group button {
            padding: 0 16px;
            white-space: nowrap;
        }

        .my-name-display {
            color: #667eea;
            font-weight: 600;
            font-size: 13px;
            text-align: center;
        }

        .status-bar {
            background: #2a2a2a;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #888;
            text-align: center;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-bar .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f87171;
        }

        .status-bar .dot.online {
            background: #4ade80;
        }

        .status-bar .dot.connecting {
            background: #fbbf24;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- Tela de Login -->
        <div id="loginScreen" class="screen active">
            <div class="login-container">
                <div class="logo">
                    <span class="icon">💬</span>
                    <h1>Glith</h1>
                </div>
                <p class="subtitle">Chat P2P simples e rápido</p>

                <div class="form-group">
                    <label>Seu Nome</label>
                    <div class="name-input-group">
                        <input type="text" id="myNameInput" placeholder="Digite seu nome" maxlength="20">
                        <button onclick="setMyName()" class="btn-primary" style="padding: 12px 16px;">Definir</button>
                    </div>
                    <div id="myNameDisplay" class="my-name-display"></div>
                </div>

                <div class="form-group">
                    <label>Seu ID (copie e envie para seu amigo)</label>
                    <div class="id-display">
                        <span id="myId">Carregando...</span>
                        <button onclick="copyId()" class="btn-icon" title="Copiar ID">📋</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>ID do amigo</label>
                    <input type="text" id="friendId" placeholder="Cole o ID do seu amigo">
                </div>

                <button onclick="connectToFriend()" class="btn-primary" id="connectBtn">🔗 Conectar</button>
                <button onclick="createNewId()" class="btn-secondary">🔄 Novo ID</button>

                <div id="connectionStatus" class="status"></div>
            </div>
        </div>

        <!-- Tela do Chat -->
        <div id="chatScreen" class="screen">
            <div class="chat-header">
                <button onclick="disconnect()" class="btn-back">←</button>
                <div class="chat-info">
                    <span class="chat-name" id="friendNameDisplay">Amigo</span>
                    <span id="friendStatus" class="status-dot online">● Online</span>
                </div>
                <button onclick="clearChat()" class="btn-icon">🗑️</button>
            </div>

            <div id="messagesContainer" class="messages-container">
                <div style="text-align: center; color: #666; padding: 20px; font-size: 14px;">
                    💬 Conecte-se para começar
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Digite sua mensagem..." disabled>
                <button onclick="sendMessage()" class="btn-send" id="sendButton" disabled>➤</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js">
    </script>
    <script>
        // ==================== CONFIGURAÇÃO ====================
        console.log('🚀 Glith iniciando...');

        let peer = null;
        let conn = null;
        let myId = '';
        let myName = 'Você';
        let friendName = 'Amigo';
        let isConnected = false;
        let isConnecting = false;

        // Elementos
        const loginScreen = document.getElementById('loginScreen');
        const chatScreen = document.getElementById('chatScreen');
        const myIdDisplay = document.getElementById('myId');
        const myNameInput = document.getElementById('myNameInput');
        const myNameDisplay = document.getElementById('myNameDisplay');
        const friendIdInput = document.getElementById('friendId');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const connectionStatus = document.getElementById('connectionStatus');
        const friendStatus = document.getElementById('friendStatus');
        const friendNameDisplay = document.getElementById('friendNameDisplay');

        // ==================== INICIALIZAR PEER ====================
        function initPeer() {
            console.log('📡 Inicializando Peer...');

            try {
                peer = new Peer(undefined, {
                    debug: 0,
                    config: {
                        'iceServers': [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' }
                        ]
                    }
                });

                peer.on('open', function(id) {
                    myId = id;
                    myIdDisplay.textContent = id;
                    console.log('✅ ID gerado:', id);
                    showStatus('✅ Seu ID: ' + id, 'connected');
                    loadName();
                });

                peer.on('connection', function(incomingConn) {
                    console.log('📞 Conexão recebida de:', incomingConn.peer);
                    handleConnection(incomingConn);
                });

                peer.on('error', function(err) {
                    console.error('❌ Erro:', err);
                    showStatus('❌ Erro: ' + err.message, 'error');
                });

                console.log('✅ Peer inicializado');
            } catch (e) {
                console.error('❌ Erro ao criar Peer:', e);
                showStatus('❌ Erro ao iniciar: ' + e.message, 'error');
            }
        }

        // ==================== CONEXÃO ====================
        function connectToFriend() {
            const friendId = friendIdInput.value.trim();

            if (!friendId) {
                showStatus('❌ Digite o ID do amigo!', 'error');
                return;
            }

            if (friendId === myId) {
                showStatus('❌ Não pode se conectar com você mesmo!', 'error');
                return;
            }

            if (isConnected) {
                showStatus('⚠️ Já está conectado!', 'info');
                return;
            }

            if (isConnecting) {
                showStatus('⏳ Já está conectando...', 'info');
                return;
            }

            console.log('🔗 Conectando a:', friendId);
            isConnecting = true;
            showStatus('⏳ Conectando a ' + friendId + '...', 'info');

            try {
                const newConn = peer.connect(friendId, {
                    reliable: true
                });

                newConn.on('open', function() {
                    console.log('✅ Conectado a:', friendId);
                    isConnecting = false;
                    isConnected = true;
                    handleConnection(newConn);
                    switchToChat();
                    showStatus('✅ Conectado!', 'connected');
                });

                newConn.on('error', function(err) {
                    console.error('❌ Erro na conexão:', err);
                    isConnecting = false;
                    showStatus('❌ Erro ao conectar: ' + err.message, 'error');
                });

                conn = newConn;
            } catch (e) {
                console.error('❌ Erro:', e);
                isConnecting = false;
                showStatus('❌ Erro: ' + e.message, 'error');
            }
        }

        function handleConnection(incomingConn) {
            conn = incomingConn;

            conn.on('open', function() {
                console.log('✅ Conexão estabelecida com:', conn.peer);
                isConnected = true;

                // Envia o nome
                if (myName) {
                    conn.send({
                        type: 'name',
                        name: myName
                    });
                }

                switchToChat();
                showStatus('✅ Conectado!', 'connected');
                friendStatus.textContent = '● Online';
                friendStatus.className = 'status-dot online';
                messageInput.disabled = false;
                sendButton.disabled = false;
                messageInput.focus();

                addSystemMessage('✅ Conectado ao amigo!');
            });

            conn.on('data', function(data) {
                console.log('📩 Dados recebidos:', data);

                if (data.type === 'message') {
                    addMessage(data.text, 'received', data.time, data.sender);
                } else if (data.type === 'name') {
                    friendName = data.name || 'Amigo';
                    friendNameDisplay.textContent = friendName;
                    addSystemMessage('👤 ' + friendName + ' entrou no chat');
                }
            });

            conn.on('close', function() {
                console.log('🔌 Conexão fechada');
                isConnected = false;
                friendStatus.textContent = '● Offline';
                friendStatus.className = 'status-dot offline';
                messageInput.disabled = true;
                sendButton.disabled = true;
                showStatus('🔌 Desconectado', 'error');
                addSystemMessage('🔌 Conexão perdida');
            });

            conn.on('error', function(err) {
                console.error('❌ Erro:', err);
                showStatus('❌ Erro: ' + err.message, 'error');
            });
        }

        // ==================== ENVIAR MENSAGEM ====================
        function sendMessage() {
            console.log('📤 Tentando enviar mensagem...');

            const text = messageInput.value.trim();

            if (!text) {
                console.log('⚠️ Mensagem vazia');
                return;
            }

            if (!conn || !isConnected) {
                console.log('⚠️ Não conectado');
                showStatus('❌ Não está conectado!', 'error');
                return;
            }

            console.log('📤 Enviando:', text);

            const data = {
                type: 'message',
                text: text,
                time: new Date().toLocaleTimeString(),
                sender: myName
            };

            try {
                conn.send(data);
                addMessage(text, 'sent', data.time, myName);
                messageInput.value = '';
                messageInput.focus();
                console.log('✅ Mensagem enviada!');
            } catch (e) {
                console.error('❌ Erro ao enviar:', e);
                showStatus('❌ Erro ao enviar: ' + e.message, 'error');
            }
        }

        // ==================== ADICIONAR MENSAGEM ====================
        function addMessage(text, type, time, sender) {
            const div = document.createElement('div');
            div.className = 'message ' + type;

            if (type === 'received' && sender) {
                div.innerHTML = `
                    <span class="sender-name">${sender}</span>
                    ${text}
                    <span class="time">${time}</span>
                `;
            } else if (type === 'sent') {
                div.innerHTML = `
                    <span class="sender-name">Você</span>
                    ${text}
                    <span class="time">${time}</span>
                `;
            } else {
                div.textContent = text;
            }

            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.style.cssText = `
                text-align: center;
                color: #666;
                font-size: 12px;
                padding: 6px;
                font-style: italic;
            `;
            div.textContent = text;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // ==================== UI ====================
        function switchToChat() {
            loginScreen.classList.remove('active');
            chatScreen.classList.add('active');
            setTimeout(() => {
                messageInput.focus();
            }, 300);
        }

        function disconnect() {
            if (conn) {
                conn.close();
                conn = null;
            }
            isConnected = false;
            isConnecting = false;
            loginScreen.classList.add('active');
            chatScreen.classList.remove('active');
            messagesContainer.innerHTML = '';
            messageInput.disabled = true;
            sendButton.disabled = true;
            friendName = 'Amigo';
            friendNameDisplay.textContent = 'Amigo';
            showStatus('🔌 Desconectado', '');
        }

        function clearChat() {
            if (confirm('Limpar todas as mensagens?')) {
                messagesContainer.innerHTML = '';
            }
        }

        function setMyName() {
            const name = myNameInput.value.trim();
            if (name) {
                myName = name;
                myNameDisplay.textContent = '👤 ' + myName;
                localStorage.setItem('glith_name', myName);
                showStatus('✅ Nome definido: ' + myName, 'connected');

                // Envia para o amigo se estiver conectado
                if (conn && isConnected) {
                    conn.send({
                        type: 'name',
                        name: myName
                    });
                }

                setTimeout(() => {
                    if (connectionStatus.textContent.includes('Nome definido')) {
                        showStatus('', '');
                    }
                }, 2000);
            }
        }

        function loadName() {
            const saved = localStorage.getItem('glith_name');
            if (saved) {
                myName = saved;
                myNameInput.value = saved;
                myNameDisplay.textContent = '👤 ' + myName;
            }
        }

        function copyId() {
            if (!myId) {
                showStatus('⏳ Aguarde o ID ser gerado...', 'info');
                return;
            }

            navigator.clipboard.writeText(myId).then(() => {
                showStatus('✅ ID copiado!', 'connected');
                setTimeout(() => showStatus('', ''), 2000);
            }).catch(() => {
                // Fallback
                const ta = document.createElement('textarea');
                ta.value = myId;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showStatus('✅ ID copiado!', 'connected');
                setTimeout(() => showStatus('', ''), 2000);
            });
        }

        function createNewId() {
            if (conn) {
                conn.close();
                conn = null;
            }
            if (peer) {
                peer.destroy();
                peer = null;
            }
            isConnected = false;
            isConnecting = false;
            showStatus('🔄 Gerando novo ID...', 'info');
            setTimeout(() => {
                location.reload();
            }, 500);
        }

        function showStatus(msg, type) {
            connectionStatus.textContent = msg;
            connectionStatus.className = 'status ' + (type || '');
        }

        // ==================== EVENTOS ====================
        // Botão enviar
        document.getElementById('sendButton').addEventListener('click', function(e) {
            e.preventDefault();
            sendMessage();
        });

        // Enter no input
        document.getElementById('messageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        // Enter no nome
        document.getElementById('myNameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                setMyName();
            }
        });

        // Carregar último ID do amigo
        const lastFriend = localStorage.getItem('glith_friend_id');
        if (lastFriend) {
            document.getElementById('friendId').value = lastFriend;
        }

        // Salvar ID do amigo
        document.getElementById('friendId').addEventListener('change', function() {
            localStorage.setItem('glith_friend_id', this.value);
        });

        // ==================== INICIAR ====================
        // Desabilitar input até conectar
        messageInput.disabled = true;
        sendButton.disabled = true;

        // Iniciar Peer
        initPeer();

        console.log('✅ Glith pronto!');
        console.log('💡 Defina seu nome e conecte a um amigo');
    </script>
</body>
</html>
