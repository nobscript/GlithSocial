<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glith - Diagnóstico</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: monospace;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1a1a1a;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #333;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #667eea;
        }
        .log-area {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 13px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #1a1a1a;
        }
        .log-entry.success {
            color: #4ade80;
        }
        .log-entry.error {
            color: #f87171;
        }
        .log-entry.info {
            color: #60a5fa;
        }
        .log-entry.warning {
            color: #fbbf24;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0a0a0a;
            color: #e0e0e0;
            font-size: 14px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            transform: scale(1.05);
        }
        button.danger {
            background: #f87171;
        }
        button.success {
            background: #4ade80;
            color: #000;
        }
        .id-box {
            background: #0a0a0a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .id-box span {
            color: #667eea;
            font-size: 14px;
            word-break: break-all;
        }
        .status-box {
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin: 10px 0;
            font-weight: 600;
        }
        .status-box.online {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
        }
        .status-box.offline {
            background: rgba(248, 113, 113, 0.1);
            color: #f87171;
        }
        .status-box.connecting {
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-group button {
            flex: 1;
            min-width: 100px;
        }
        .chat-box {
            margin-top: 20px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }
        .messages {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .msg {
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 8px;
            max-width: 80%;
        }
        .msg.sent {
            background: #667eea;
            color: white;
            margin-left: auto;
        }
        .msg.received {
            background: #2a2a2a;
            color: #e0e0e0;
        }
        .msg.system {
            text-align: center;
            color: #666;
            font-style: italic;
            font-size: 12px;
            max-width: 100%;
        }
        .chat-input {
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Glith - Diagnóstico</h1>

        <!-- Status -->
        <div id="statusBox" class="status-box offline">⛔ Desconectado</div>

        <!-- ID -->
        <div class="id-box">
            <span id="myIdDisplay">⏳ Carregando ID...</span>
            <button onclick="copyId()">📋 Copiar</button>
        </div>

        <!-- Inputs -->
        <div class="input-group">
            <input type="text" id="friendIdInput" placeholder="ID do amigo">
            <button onclick="connectToFriend()" id="connectBtn">🔗 Conectar</button>
        </div>

        <div class="input-group">
            <input type="text" id="nameInput" placeholder="Seu nome" maxlength="20">
            <button onclick="setName()">📝 Definir Nome</button>
        </div>

        <!-- Botões de teste -->
        <div class="btn-group">
            <button onclick="testPeer()" class="success">🧪 Testar Peer</button>
            <button onclick="testConnection()">🔍 Testar Conexão</button>
            <button onclick="recreatePeer()" class="danger">🔄 Recriar Peer</button>
        </div>

        <!-- Chat -->
        <div class="chat-box" id="chatBox">
            <div class="messages" id="messagesContainer">
                <div class="msg system">💬 Aguardando conexão...</div>
            </div>
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Digite sua mensagem..." disabled>
                <button onclick="sendMessage()" id="sendBtn" disabled>➤</button>
            </div>
        </div>

        <!-- Log -->
        <div style="margin-top: 20px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <strong>📋 Log de Diagnóstico</strong>
                <button onclick="clearLog()" style="padding: 4px 12px; font-size: 12px;">Limpar</button>
            </div>
            <div class="log-area" id="logArea">
                <div class="log-entry info">🚀 Iniciando diagnóstico...</div>
            </div>
        </div>
    </div>

    <script>
        // ==================== VARIÁVEIS GLOBAIS ====================
        let peer = null;
        let conn = null;
        let myId = '';
        let myName = 'Você';
        let isConnected = false;
        let isConnecting = false;

        // ==================== LOG ====================
        function log(msg, type = 'info') {
            const area = document.getElementById('logArea');
            const div = document.createElement('div');
            div.className = 'log-entry ' + type;
            const time = new Date().toLocaleTimeString();
            div.textContent = `[${time}] ${msg}`;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;

            // Também mostra no console
            console.log(`[${time}]`, msg);

            // Mostra alerta se for erro
            if (type === 'error') {
                // Não usar alert para não travar
            }
        }

        function clearLog() {
            document.getElementById('logArea').innerHTML = '';
            log('📋 Log limpo');
        }

        // ==================== STATUS ====================
        function setStatus(text, type) {
            const box = document.getElementById('statusBox');
            box.textContent = text;
            box.className = 'status-box ' + type;
        }

        // ==================== INICIALIZAR PEER ====================
        function initPeer() {
            log('📡 Inicializando PeerJS...');

            try {
                // Verifica se PeerJS carregou
                if (typeof Peer === 'undefined') {
                    log('❌ PeerJS NÃO CARREGOU! Verifique sua internet.', 'error');
                    setStatus('❌ Erro: PeerJS não carregou', 'offline');
                    return;
                }

                log('✅ PeerJS está disponível', 'success');

                // Destroi peer antigo se existir
                if (peer) {
                    peer.destroy();
                    peer = null;
                }

                peer = new Peer(undefined, {
                    debug: 2,
                    config: {
                        'iceServers': [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' },
                            { urls: 'stun:stun2.l.google.com:19302' }
                        ]
                    }
                });

                log('✅ Peer criado, aguardando ID...', 'success');

                peer.on('open', function(id) {
                    myId = id;
                    document.getElementById('myIdDisplay').textContent = id;
                    log('✅ ID gerado: ' + id, 'success');
                    setStatus('✅ ID: ' + id, 'online');
                    loadName();
                });

                peer.on('connection', function(incomingConn) {
                    log('📞 Conexão RECEBIDA de: ' + incomingConn.peer, 'info');
                    handleConnection(incomingConn);
                });

                peer.on('error', function(err) {
                    log('❌ Erro no Peer: ' + err.message, 'error');
                    setStatus('❌ Erro: ' + err.message, 'offline');

                    // Se for erro de ID, tenta recriar
                    if (err.message.includes('ID')) {
                        log('🔄 Tentando recriar Peer...', 'warning');
                        setTimeout(() => {
                            recreatePeer();
                        }, 2000);
                    }
                });

                peer.on('disconnected', function() {
                    log('⚠️ Peer desconectado do servidor', 'warning');
                    setStatus('⚠️ Desconectado do servidor', 'offline');
                });

                log('✅ Peer inicializado com sucesso!', 'success');

            } catch (e) {
                log('❌ Erro ao criar Peer: ' + e.message, 'error');
                setStatus('❌ Erro: ' + e.message, 'offline');
            }
        }

        // ==================== CONEXÃO ====================
        function connectToFriend() {
            const friendId = document.getElementById('friendIdInput').value.trim();

            log('🔗 Tentando conectar a: ' + friendId);

            if (!friendId) {
                log('❌ ID do amigo vazio!', 'error');
                setStatus('❌ Digite um ID', 'offline');
                return;
            }

            if (friendId === myId) {
                log('❌ Não pode conectar com você mesmo!', 'error');
                setStatus('❌ É você mesmo!', 'offline');
                return;
            }

            if (isConnected) {
                log('⚠️ Já está conectado!', 'warning');
                return;
            }

            if (isConnecting) {
                log('⏳ Já está conectando...', 'warning');
                return;
            }

            if (!peer) {
                log('❌ Peer não inicializado!', 'error');
                setStatus('❌ Peer não iniciado', 'offline');
                return;
            }

            isConnecting = true;
            setStatus('⏳ Conectando...', 'connecting');
            log('⏳ Conectando a ' + friendId + '...', 'info');

            try {
                const newConn = peer.connect(friendId, {
                    reliable: true
                });

                log('📤 Tentativa de conexão enviada', 'info');

                // Timeout de conexão
                const timeout = setTimeout(() => {
                    if (!isConnected && isConnecting) {
                        log('⏰ Timeout de conexão!', 'error');
                        setStatus('⏰ Timeout', 'offline');
                        isConnecting = false;
                        if (newConn) {
                            newConn.close();
                        }
                    }
                }, 15000);

                newConn.on('open', function() {
                    clearTimeout(timeout);
                    log('✅ CONECTADO a ' + friendId + '!', 'success');
                    isConnecting = false;
                    isConnected = true;
                    conn = newConn;
                    setStatus('✅ Conectado', 'online');
                    enableChat(true);
                    document.getElementById('messagesContainer').innerHTML = '';
                    addSystemMessage('✅ Conectado ao amigo!');
                    showStatus('✅ Conectado!');
                });

                newConn.on('error', function(err) {
                    clearTimeout(timeout);
                    log('❌ Erro na conexão: ' + err.message, 'error');
                    isConnecting = false;
                    setStatus('❌ Erro: ' + err.message, 'offline');
                });

                newConn.on('close', function() {
                    log('🔌 Conexão fechada', 'warning');
                    isConnected = false;
                    isConnecting = false;
                    setStatus('🔌 Desconectado', 'offline');
                    enableChat(false);
                    addSystemMessage('🔌 Conexão perdida');
                });

                conn = newConn;

            } catch (e) {
                log('❌ Erro ao conectar: ' + e.message, 'error');
                isConnecting = false;
                setStatus('❌ Erro: ' + e.message, 'offline');
            }
        }

        function handleConnection(incomingConn) {
            conn = incomingConn;

            conn.on('open', function() {
                log('✅ Conexão estabelecida com: ' + conn.peer, 'success');
                isConnected = true;
                setStatus('✅ Conectado', 'online');
                enableChat(true);
                document.getElementById('messagesContainer').innerHTML = '';
                addSystemMessage('✅ Conectado ao amigo!');

                if (myName) {
                    conn.send({
                        type: 'name',
                        name: myName
                    });
                }
            });

            conn.on('data', function(data) {
                log('📩 Dados recebidos: ' + JSON.stringify(data).substring(0, 50), 'info');

                if (data.type === 'message') {
                    addMessage(data.text, 'received', data.time, data.sender);
                } else if (data.type === 'name') {
                    log('👤 Amigo se chama: ' + data.name, 'success');
                    addSystemMessage('👤 ' + data.name + ' entrou no chat');
                }
            });

            conn.on('close', function() {
                log('🔌 Conexão fechada', 'warning');
                isConnected = false;
                setStatus('🔌 Desconectado', 'offline');
                enableChat(false);
                addSystemMessage('🔌 Conexão perdida');
            });

            conn.on('error', function(err) {
                log('❌ Erro: ' + err.message, 'error');
            });
        }

        // ==================== ENVIAR MENSAGEM ====================
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            log('📤 Tentando enviar: "' + text + '"');

            if (!text) {
                log('⚠️ Mensagem vazia', 'warning');
                return;
            }

            if (!conn || !isConnected) {
                log('❌ Não conectado!', 'error');
                setStatus('❌ Não conectado', 'offline');
                return;
            }

            const data = {
                type: 'message',
                text: text,
                time: new Date().toLocaleTimeString(),
                sender: myName
            };

            try {
                conn.send(data);
                log('✅ Mensagem enviada!', 'success');
                addMessage(text, 'sent', data.time, myName);
                input.value = '';
                input.focus();
            } catch (e) {
                log('❌ Erro ao enviar: ' + e.message, 'error');
                setStatus('❌ Erro: ' + e.message, 'offline');
            }
        }

        // ==================== UI ====================
        function addMessage(text, type, time, sender) {
            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            div.className = 'msg ' + type;

            if (type === 'received' && sender) {
                div.innerHTML = `<strong>${sender}:</strong> ${text}`;
            } else if (type === 'sent') {
                div.innerHTML = `<strong>Você:</strong> ${text}`;
            } else {
                div.textContent = text;
            }

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addSystemMessage(text) {
            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            div.className = 'msg system';
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function enableChat(enabled) {
            document.getElementById('messageInput').disabled = !enabled;
            document.getElementById('sendBtn').disabled = !enabled;
            if (enabled) {
                document.getElementById('messageInput').focus();
            }
        }

        function showStatus(msg) {
            // Mostra no status por 3 segundos
            const original = document.getElementById('statusBox').textContent;
            setTimeout(() => {
                // Não faz nada, o status já é atualizado pelo setStatus
            }, 3000);
        }

        // ==================== TESTES ====================
        function testPeer() {
            log('🧪 Testando Peer...');

            if (!peer) {
                log('❌ Peer é null', 'error');
                setStatus('❌ Peer não existe', 'offline');
                return;
            }

            log('✅ Peer existe', 'success');
            log('📋 Peer ID: ' + (peer.id || 'não gerado'), 'info');
            log('📋 Conexões ativas: ' + (peer.connections ? Object.keys(peer.connections).length : 0), 'info');

            if (myId) {
                log('✅ Meu ID: ' + myId, 'success');
                setStatus('✅ ID: ' + myId, 'online');
            } else {
                log('⚠️ ID ainda não gerado', 'warning');
                setStatus('⏳ Aguardando ID...', 'connecting');
            }

            if (conn) {
                log('✅ Conexão ativa com: ' + (conn.peer || 'desconhecido'), 'success');
            } else {
                log('⚠️ Nenhuma conexão ativa', 'warning');
            }

            log('✅ Teste concluído', 'success');
        }

        function testConnection() {
            log('🧪 Testando conexão...');

            if (isConnected && conn) {
                log('✅ CONECTADO!', 'success');
                setStatus('✅ Conectado', 'online');
                // Tenta enviar um ping
                try {
                    conn.send({
                        type: 'ping',
                        time: new Date().toISOString()
                    });
                    log('📤 Ping enviado!', 'success');
                } catch (e) {
                    log('❌ Erro ao enviar ping: ' + e.message, 'error');
                }
            } else {
                log('❌ NÃO CONECTADO', 'error');
                setStatus('❌ Desconectado', 'offline');
                log('🔍 isConnected: ' + isConnected, 'info');
                log('🔍 conn: ' + (conn ? 'existe' : 'null'), 'info');
            }
        }

        function recreatePeer() {
            log('🔄 Recriando Peer...', 'warning');

            if (conn) {
                conn.close();
                conn = null;
            }

            if (peer) {
                peer.destroy();
                peer = null;
            }

            isConnected = false;
            isConnecting = false;
            myId = '';
            document.getElementById('myIdDisplay').textContent = '⏳ Carregando...';
            setStatus('🔄 Recriando...', 'connecting');
            enableChat(false);

            setTimeout(() => {
                initPeer();
            }, 500);
        }

        // ==================== NOME ====================
        function setName() {
            const name = document.getElementById('nameInput').value.trim();
            if (name) {
                myName = name;
                localStorage.setItem('glith_name', name);
                log('📝 Nome definido: ' + name, 'success');

                if (conn && isConnected) {
                    conn.send({
                        type: 'name',
                        name: name
                    });
                    log('📤 Nome enviado para o amigo', 'success');
                }
            } else {
                log('⚠️ Digite um nome!', 'warning');
            }
        }

        function loadName() {
            const saved = localStorage.getItem('glith_name');
            if (saved) {
                myName = saved;
                document.getElementById('nameInput').value = saved;
                log('📝 Nome carregado: ' + saved, 'success');
            }
        }

        // ==================== COPIAR ID ====================
        function copyId() {
            if (!myId) {
                log('⏳ Aguarde o ID ser gerado...', 'warning');
                return;
            }

            navigator.clipboard.writeText(myId).then(() => {
                log('📋 ID copiado!', 'success');
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = myId;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                log('📋 ID copiado (fallback)!', 'success');
            });
        }

        // ==================== EVENTOS ====================
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 Página carregada!');
            log('📦 Inicializando...');

            // Iniciar Peer
            initPeer();

            // Eventos de teclado
            document.getElementById('messageInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
            });

            document.getElementById('friendIdInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    connectToFriend();
                }
            });

            document.getElementById('nameInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    setName();
                }
            });

            // Carregar último ID do amigo
            const lastFriend = localStorage.getItem('glith_friend_id');
            if (lastFriend) {
                document.getElementById('friendIdInput').value = lastFriend;
                log('📋 ID do amigo carregado: ' + lastFriend, 'info');
            }

            log('✅ Pronto! Use os botões para testar.', 'success');
            log('💡 Dica: Abra em 2 navegadores diferentes', 'info');
        });

        // ==================== INICIALIZAÇÃO ====================
        console.log('🚀 Glith - Modo Diagnóstico');
        console.log('📝 Abra o console para ver os logs detalhados');
    </script>
</body>
</html>
