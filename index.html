<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glith - Chat P2P</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            background: #1a1a1a;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 20px;
        }

        .screen.active {
            display: flex;
        }

        /* Login Screen */
        .login-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .logo {
            text-align: center;
        }

        .logo .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-top: -8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 13px;
            color: #aaa;
            font-weight: 500;
        }

        .id-display {
            background: #2a2a2a;
            padding: 14px 18px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
        }

        .id-display span {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #667eea;
            word-break: break-all;
        }

        input[type="text"] {
            background: #2a2a2a;
            border: 1px solid #333;
            padding: 14px 18px;
            border-radius: 12px;
            color: #e0e0e0;
            font-size: 14px;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            background: #303030;
        }

        .btn-primary, .btn-secondary {
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: #667eea;
            border: 1px solid #667eea;
        }

        .btn-secondary:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .btn-icon:hover {
            background: #333;
            color: #e0e0e0;
        }

        .status {
            text-align: center;
            font-size: 13px;
            padding: 8px;
            border-radius: 8px;
            min-height: 36px;
        }

        .status.connected {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        .status.error {
            color: #f87171;
            background: rgba(248, 113, 113, 0.1);
        }

        /* Chat Screen */
        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 0;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 16px;
        }

        .btn-back {
            background: transparent;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.3s;
        }

        .btn-back:hover {
            color: #e0e0e0;
        }

        .chat-info {
            flex: 1;
        }

        .chat-name {
            font-weight: 600;
            font-size: 16px;
            display: block;
        }

        .status-dot {
            font-size: 12px;
            color: #4ade80;
        }

        .status-dot.offline {
            color: #f87171;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .messages-container::-webkit-scrollbar {
            width: 4px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 2px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            animation: slideIn 0.3s ease;
            word-wrap: break-word;
            position: relative;
        }

        .message .sender-name {
            font-size: 11px;
            font-weight: 600;
            opacity: 0.8;
            display: block;
            margin-bottom: 4px;
        }

        .message.sent {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            background: #2a2a2a;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message .time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
            display: block;
            text-align: right;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-area {
            display: flex;
            gap: 8px;
            padding: 16px 0;
            border-top: 1px solid #2a2a2a;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #e0e0e0;
            font-size: 14px;
        }

        .input-area input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-send {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-send:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-send:active {
            transform: scale(0.95);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .app {
                max-height: 100vh;
                border-radius: 0;
            }
        }

        .name-input-group {
            display: flex;
            gap: 8px;
        }

        .name-input-group input {
            flex: 1;
        }

        .name-input-group button {
            padding: 0 16px;
            white-space: nowrap;
        }

        .my-name-display {
            color: #667eea;
            font-weight: 600;
            font-size: 13px;
            text-align: center;
            margin-top: -8px;
        }

        .friend-id-hint {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: -4px;
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- Tela de Login/ID -->
        <div id="loginScreen" class="screen active">
            <div class="login-container">
                <div class="logo">
                    <span class="icon">💬</span>
                    <h1>Glith</h1>
                </div>
                <p class="subtitle">Chat P2P descentralizado</p>
                
                <div class="form-group">
                    <label>Seu Nome</label>
                    <div class="name-input-group">
                        <input type="text" id="myNameInput" placeholder="Digite seu nome" maxlength="20">
                        <button onclick="setMyName()" class="btn-primary" style="padding: 14px 20px;">Definir</button>
                    </div>
                    <div id="myNameDisplay" class="my-name-display"></div>
                </div>

                <div class="form-group">
                    <label>Seu ID (copie e envie para seu amigo)</label>
                    <div class="id-display">
                        <span id="myId">Carregando...</span>
                        <button onclick="copyId()" class="btn-icon" title="Copiar ID">📋</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>ID do amigo (cole o ID que ele te enviou)</label>
                    <input type="text" id="friendId" placeholder="Digite o ID do seu amigo">
                    <div class="friend-id-hint">Exemplo: abc123-def-456</div>
                </div>

                <button onclick="connectToFriend()" class="btn-primary" id="connectBtn">Conectar</button>
                <button onclick="createNewId()" class="btn-secondary">Novo ID</button>

                <div id="connectionStatus" class="status"></div>
            </div>
        </div>

        <!-- Tela do Chat -->
        <div id="chatScreen" class="screen">
            <div class="chat-header">
                <button onclick="disconnect()" class="btn-back">←</button>
                <div class="chat-info">
                    <span class="chat-name" id="friendNameDisplay">Amigo</span>
                    <span id="friendStatus" class="status-dot online">● Online</span>
                </div>
                <button onclick="clearChat()" class="btn-icon">🗑️</button>
            </div>

            <div id="messagesContainer" class="messages-container">
                <div style="text-align: center; color: #666; padding: 20px; font-size: 14px;">
                    Conectado! Comece a conversar 💬
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Digite sua mensagem..." 
                       onkeydown="if(event.key === 'Enter') { event.preventDefault(); sendMessage(); }">
                <button onclick="sendMessage()" class="btn-send" id="sendButton">➤</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== CONFIGURAÇÃO ====================
        const peer = new Peer(undefined, {
            debug: 2,
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        });

        let currentConnection = null;
        let myId = '';
        let friendId = '';
        let isConnected = false;
        let myName = 'Você';
        let friendName = 'Amigo';

        // ==================== ELEMENTOS DOM ====================
        const loginScreen = document.getElementById('loginScreen');
        const chatScreen = document.getElementById('chatScreen');
        const myIdDisplay = document.getElementById('myId');
        const myNameInput = document.getElementById('myNameInput');
        const myNameDisplay = document.getElementById('myNameDisplay');
        const friendIdInput = document.getElementById('friendId');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const connectionStatus = document.getElementById('connectionStatus');
        const friendStatus = document.getElementById('friendStatus');
        const friendNameDisplay = document.getElementById('friendNameDisplay');
        const sendButton = document.getElementById('sendButton');
        const connectBtn = document.getElementById('connectBtn');

        // ==================== PEER EVENTS ====================
        peer.on('open', (id) => {
            myId = id;
            myIdDisplay.textContent = id;
            console.log('✅ Meu ID:', id);
            saveIdToStorage(id);
            loadMyName();
        });

        peer.on('connection', (conn) => {
            console.log('📞 Conexão recebida de:', conn.peer);
            friendId = conn.peer;
            setupConnection(conn);
            switchToChat();
        });

        peer.on('error', (err) => {
            console.error('❌ Erro PeerJS:', err);
            showStatus('Erro: ' + err.message, 'error');
        });

        // ==================== FUNÇÕES DE NOME ====================
        function setMyName() {
            const name = myNameInput.value.trim();
            if (name) {
                myName = name;
                myNameDisplay.textContent = `👤 ${myName}`;
                localStorage.setItem('glith_my_name', myName);
                
                if (currentConnection && isConnected) {
                    currentConnection.send({
                        type: 'name_update',
                        name: myName
                    });
                }
                showStatus('✅ Nome definido: ' + myName, 'connected');
                setTimeout(() => showStatus('', ''), 2000);
            } else {
                showStatus('Digite um nome!', 'error');
            }
        }

        function loadMyName() {
            const savedName = localStorage.getItem('glith_my_name');
            if (savedName) {
                myName = savedName;
                myNameInput.value = savedName;
                myNameDisplay.textContent = `👤 ${myName}`;
            }
        }

        function updateFriendName(name) {
            if (name) {
                friendName = name;
                friendNameDisplay.textContent = friendName;
            }
        }

        // ==================== FUNÇÕES PRINCIPAIS ====================
        function connectToFriend() {
            const id = friendIdInput.value.trim();
            if (!id) {
                showStatus('Digite o ID do seu amigo!', 'error');
                return;
            }

            if (id === myId) {
                showStatus('Não pode se conectar com você mesmo!', 'error');
                return;
            }

            localStorage.setItem('glith_friend_id', id);
            showStatus('Conectando...', '');
            
            try {
                const conn = peer.connect(id, {
                    reliable: true
                });
                setupConnection(conn);
                friendId = id;
                switchToChat();
            } catch (error) {
                showStatus('Erro ao conectar: ' + error.message, 'error');
            }
        }

        function setupConnection(conn) {
            currentConnection = conn;
            
            conn.on('open', () => {
                console.log('🔗 Conectado ao:', conn.peer);
                isConnected = true;
                showStatus('✅ Conectado!', 'connected');
                friendStatus.textContent = '● Online';
                friendStatus.className = 'status-dot online';
                
                // Limpa mensagem inicial
                messagesContainer.innerHTML = '';
                addSystemMessage('Conectado ao amigo!');
                
                if (myName) {
                    conn.send({
                        type: 'name_update',
                        name: myName
                    });
                }
                
                messageInput.focus();
            });

            conn.on('data', (data) => {
                console.log('📩 Dados recebidos:', data);
                
                if (data.type === 'message') {
                    receiveMessage(data.text, data.time, data.senderName);
                } else if (data.type === 'name_update') {
                    updateFriendName(data.name);
                    addSystemMessage(`✨ ${data.name} está online`);
                }
            });

            conn.on('close', () => {
                console.log('🔌 Conexão fechada');
                isConnected = false;
                friendStatus.textContent = '● Offline';
                friendStatus.className = 'status-dot offline';
                addSystemMessage('Conexão perdida');
                showStatus('Desconectado', 'error');
            });

            conn.on('error', (err) => {
                console.error('❌ Erro na conexão:', err);
                showStatus('Erro na conexão', 'error');
            });
        }

        function sendMessage() {
            console.log('🔵 Tentando enviar mensagem...');
            const text = messageInput.value.trim();
            
            if (!text) {
                console.log('⚠️ Mensagem vazia');
                return;
            }
            
            if (!currentConnection) {
                console.log('⚠️ Sem conexão');
                showStatus('Sem conexão!', 'error');
                return;
            }
            
            if (!isConnected) {
                console.log('⚠️ Desconectado');
                showStatus('Você está desconectado!', 'error');
                return;
            }

            console.log('📤 Enviando mensagem:', text);
            
            const messageData = {
                type: 'message',
                text: text,
                time: new Date().toLocaleTimeString(),
                senderName: myName
            };

            try {
                currentConnection.send(messageData);
                addMessage(text, 'sent', messageData.time, myName);
                messageInput.value = '';
                messageInput.focus();
                console.log('✅ Mensagem enviada com sucesso!');
            } catch (error) {
                console.error('❌ Erro ao enviar:', error);
                showStatus('Erro ao enviar mensagem', 'error');
            }
        }

        function receiveMessage(text, time, senderName) {
            console.log('📩 Mensagem recebida de', senderName, ':', text);
            addMessage(text, 'received', time, senderName || 'Amigo');
        }

        function addMessage(text, type, time, senderName) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            let nameHtml = '';
            if (type === 'received' && senderName) {
                nameHtml = `<span class="sender-name">${senderName}</span>`;
            } else if (type === 'sent') {
                nameHtml = `<span class="sender-name">Você</span>`;
            }
            
            messageDiv.innerHTML = `
                ${nameHtml}
                ${text}
                <span class="time">${time || new Date().toLocaleTimeString()}</span>
            `;
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function addSystemMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.style.cssText = `
                text-align: center;
                color: #888;
                font-size: 12px;
                padding: 8px;
                font-style: italic;
            `;
            messageDiv.textContent = text;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function switchToChat() {
            loginScreen.classList.remove('active');
            chatScreen.classList.add('active');
            setTimeout(() => {
                messageInput.focus();
                console.log('🎯 Foco no input de mensagem');
            }, 300);
        }

        function disconnect() {
            if (currentConnection) {
                currentConnection.close();
                currentConnection = null;
            }
            isConnected = false;
            friendId = '';
            friendName = 'Amigo';
            friendNameDisplay.textContent = 'Amigo';
            loginScreen.classList.add('active');
            chatScreen.classList.remove('active');
            messagesContainer.innerHTML = '';
            showStatus('Desconectado', '');
        }

        function clearChat() {
            if (confirm('Limpar todas as mensagens?')) {
                messagesContainer.innerHTML = '';
            }
        }

        function copyId() {
            navigator.clipboard.writeText(myId).then(() => {
                showStatus('✅ ID copiado!', 'connected');
                setTimeout(() => showStatus('', ''), 2000);
            }).catch(() => {
                const textArea = document.createElement('textarea');
                textArea.value = myId;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showStatus('✅ ID copiado!', 'connected');
                setTimeout(() => showStatus('', ''), 2000);
            });
        }

        function createNewId() {
            if (currentConnection) {
                currentConnection.close();
                currentConnection = null;
            }
            peer.destroy();
            location.reload();
        }

        function showStatus(message, type) {
            connectionStatus.textContent = message;
            connectionStatus.className = 'status ' + (type || '');
        }

        // ==================== STORAGE ====================
        function saveIdToStorage(id) {
            try {
                localStorage.setItem('glith_last_id', id);
            } catch (e) {}
        }

        function loadLastId() {
            try {
                return localStorage.getItem('glith_friend_id');
            } catch (e) {
                return null;
            }
        }

        // ==================== EVENT LISTENERS ====================
        const lastFriendId = loadLastId();
        if (lastFriendId) {
            friendIdInput.value = lastFriendId;
        }

        myNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                setMyName();
            }
        });

        // EVENTO PRINCIPAL - GARANTE QUE O BOTÃO FUNCIONE
        sendButton.addEventListener('click', function(e) {
            e.preventDefault();
            console.log('🖱️ Botão de enviar clicado!');
            sendMessage();
        });

        // Também garante que o Enter funcione
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                console.log('⌨️ Enter pressionado!');
                sendMessage();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && chatScreen.classList.contains('active')) {
                disconnect();
            }
        });

        console.log('🚀 Glith iniciado!');
        console.log('💡 Compartilhe seu ID com um amigo para conversar');
        console.log('📝 Defina seu nome para aparecer nas mensagens');
        console.log('🔍 Teste: Clique no botão ➤ para enviar mensagens');
    </script>
</body>
</html>
