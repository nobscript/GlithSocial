<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glith · Entrar / Criar conta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f7f5f2;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .auth-wrapper {
            background: #ffffff;
            max-width: 480px;
            width: 100%;
            border-radius: 56px;
            padding: 2.8rem 2rem 2.5rem;
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.08), 0 6px 18px rgba(0, 0, 0, 0.02);
            border: 1px solid #eeeae5;
            text-align: center;
            transition: all 0.2s;
            position: relative;
        }

        .brand-header {
            margin-bottom: 1.2rem;
        }

        .brand-name {
            font-family: 'Playfair Display', 'Georgia', serif;
            font-weight: 700;
            font-style: italic;
            font-size: 3.2rem;
            letter-spacing: -1px;
            background: linear-gradient(145deg, #1e1e1e 0%, #4a4a4a 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }

        .brand-sub {
            font-size: 0.8rem;
            color: #9b9289;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: -4px;
        }

        /* ===== TABS ===== */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin: 1.2rem 0 1.8rem;
            background: #f3f0ec;
            border-radius: 60px;
            padding: 0.3rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.7rem;
            border: none;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.25s;
            background: transparent;
            color: #5f5a54;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #1e1e1e;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .tab-btn:hover:not(.active) {
            background: #e8e3dd;
        }

        /* ===== FORMULÁRIOS ===== */
        .form-container {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .form-container.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            text-align: left;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #3d3d3d;
            letter-spacing: -0.2px;
            margin-left: 0.2rem;
        }

        .input-group input {
            padding: 0.9rem 1.2rem;
            border-radius: 60px;
            border: 1px solid #ddd8d1;
            background: #fcfaf8;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: border 0.15s, box-shadow 0.15s;
            outline: none;
            width: 100%;
        }

        .input-group input:focus {
            border-color: #8f8a82;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.02);
            background: #ffffff;
        }

        .input-group input::placeholder {
            color: #b1aaa2;
            font-weight: 300;
            font-size: 0.95rem;
        }

        .btn-submit {
            background: #1e1e1e;
            border: none;
            padding: 0.9rem;
            border-radius: 60px;
            color: white;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-family: 'Inter', sans-serif;
            margin-top: 0.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: #333;
        }
        .btn-submit:active {
            transform: scale(0.97);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== LINK "ESQUECEU A SENHA?" ===== */
        .form-options {
            display: flex;
            justify-content: flex-end;
            margin-top: -0.2rem;
        }

        .forgot-link {
            font-size: 0.85rem;
            color: #6b635b;
            text-decoration: none;
            border-bottom: 1px dashed #d6cec6;
            padding-bottom: 2px;
            cursor: pointer;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            font-family: 'Inter', sans-serif;
            transition: color 0.15s, border-color 0.15s;
        }

        .forgot-link:hover {
            color: #1e1e1e;
            border-bottom-color: #8a8177;
        }

        /* ===== CAPTCHA ===== */
        .captcha-area {
            background: #f3f0ec;
            border-radius: 60px;
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .captcha-text {
            font-size: 1.4rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
            color: #1e1e1e;
            background: #e8e3dd;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            user-select: none;
        }

        .captcha-input {
            flex: 1;
            min-width: 100px;
            padding: 0.6rem 1rem;
            border-radius: 40px;
            border: 1px solid #d6cec6;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            outline: none;
            transition: border 0.15s;
        }

        .captcha-input:focus {
            border-color: #8f8a82;
        }

        .captcha-refresh {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            color: #5f5a54;
            cursor: pointer;
            padding: 0.3rem 0.6rem;
            border-radius: 30px;
            transition: background 0.2s;
        }

        .captcha-refresh:hover {
            background: #e0dad4;
        }

        /* ===== MENSAGENS ===== */
        .feedback-message {
            margin-top: 0.8rem;
            font-size: 0.9rem;
            color: #4f7b6a;
            min-height: 1.6rem;
            transition: opacity 0.2s;
        }

        .feedback-message.error {
            color: #b15e5e;
        }

        .feedback-message.success {
            color: #2d7a5a;
        }

        .feedback-message.info {
            color: #4f6b8a;
        }

        /* responsivo */
        @media (max-width: 480px) {
            .auth-wrapper {
                padding: 2rem 1.2rem;
                border-radius: 40px;
            }
            .brand-name {
                font-size: 2.6rem;
            }
            .captcha-area {
                flex-direction: column;
                align-items: stretch;
            }
            .captcha-text {
                text-align: center;
            }
        }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <!-- Cabeçalho -->
    <div class="brand-header">
        <div class="brand-name">Glith</div>
        <div class="brand-sub">rede social</div>
    </div>

    <!-- TABS: Entrar / Criar conta -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="login" id="tabLogin">
            <i class="fas fa-sign-in-alt" style="margin-right: 6px;"></i> Entrar
        </button>
        <button class="tab-btn" data-tab="signup" id="tabSignup">
            <i class="fas fa-user-plus" style="margin-right: 6px;"></i> Criar conta
        </button>
    </div>

    <!-- ============================================ -->
    <!-- FORMULÁRIO DE LOGIN -->
    <!-- ============================================ -->
    <div class="form-container active" id="formLogin">
        <form class="auth-form" id="loginForm">
            <div class="input-group">
                <label for="loginEmail">E-mail ou usuário</label>
                <input type="text" id="loginEmail" placeholder="exemplo@email.com ou @usuario" required />
            </div>
            <div class="input-group">
                <label for="loginSenha">Senha</label>
                <input type="password" id="loginSenha" placeholder="••••••••" required />
            </div>

            <div class="form-options">
                <button type="button" class="forgot-link" id="forgotPasswordBtn">
                    <i class="far fa-question-circle" style="margin-right: 4px;"></i> Esqueceu a senha?
                </button>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-arrow-right"></i> Entrar
            </button>
        </form>
        <div class="feedback-message" id="loginFeedback"></div>
    </div>

    <!-- ============================================ -->
    <!-- FORMULÁRIO DE CADASTRO (com CAPTCHA) -->
    <!-- ============================================ -->
    <div class="form-container" id="formSignup">
        <form class="auth-form" id="signupForm">
            <div class="input-group">
                <label for="signupNome">Nome</label>
                <input type="text" id="signupNome" placeholder="Seu nome completo" required />
            </div>
            <div class="input-group">
                <label for="signupEmail">E-mail</label>
                <input type="email" id="signupEmail" placeholder="exemplo@email.com" required />
            </div>
            <div class="input-group">
                <label for="signupSenha">Senha</label>
                <input type="password" id="signupSenha" placeholder="•••••••• (mín. 6)" required minlength="6" />
            </div>

            <!-- CAPTCHA -->
            <div class="captcha-area">
                <span class="captcha-text" id="captchaDisplay">12 + 34</span>
                <input type="text" class="captcha-input" id="captchaInput" placeholder="Resultado" autocomplete="off" />
                <button type="button" class="captcha-refresh" id="captchaRefresh" title="Atualizar CAPTCHA">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>

            <button type="submit" class="btn-submit" id="signupBtn">
                <i class="fas fa-user-plus"></i> Criar conta
            </button>
        </form>
        <div class="feedback-message" id="signupFeedback"></div>
    </div>
</div>

<script>
    (function() {
        // ===== ELEMENTOS =====
        const tabLogin = document.getElementById('tabLogin');
        const tabSignup = document.getElementById('tabSignup');
        const formLogin = document.getElementById('formLogin');
        const formSignup = document.getElementById('formSignup');

        const loginForm = document.getElementById('loginForm');
        const loginFeedback = document.getElementById('loginFeedback');

        const signupForm = document.getElementById('signupForm');
        const signupFeedback = document.getElementById('signupFeedback');
        const signupBtn = document.getElementById('signupBtn');

        const captchaDisplay = document.getElementById('captchaDisplay');
        const captchaInput = document.getElementById('captchaInput');
        const captchaRefresh = document.getElementById('captchaRefresh');

        const forgotBtn = document.getElementById('forgotPasswordBtn');

        // ===== ESTADO DO CAPTCHA =====
        let captchaResult = 0;

        function generateCaptcha() {
            const num1 = Math.floor(Math.random() * 10) + 1;
            const num2 = Math.floor(Math.random() * 10) + 1;
            const operators = ['+', '-'];
            const op = operators[Math.floor(Math.random() * operators.length)];

            let result;
            let display;

            if (op === '+') {
                result = num1 + num2;
                display = `${num1} + ${num2}`;
            } else {
                // Garantir que o resultado seja positivo
                const bigger = Math.max(num1, num2);
                const smaller = Math.min(num1, num2);
                result = bigger - smaller;
                display = `${bigger} - ${smaller}`;
            }

            captchaResult = result;
            captchaDisplay.textContent = display;
            captchaInput.value = '';
            captchaInput.focus();
        }

        // ===== TABS =====
        function switchTab(tab) {
            // Atualiza botões
            tabLogin.classList.toggle('active', tab === 'login');
            tabSignup.classList.toggle('active', tab === 'signup');

            // Mostra/oculta formulários
            formLogin.classList.toggle('active', tab === 'login');
            formSignup.classList.toggle('active', tab === 'signup');

            // Limpa feedbacks
            loginFeedback.textContent = '';
            loginFeedback.className = 'feedback-message';
            signupFeedback.textContent = '';
            signupFeedback.className = 'feedback-message';

            // Se for cadastro, gera novo CAPTCHA
            if (tab === 'signup') {
                generateCaptcha();
            }
        }

        tabLogin.addEventListener('click', () => switchTab('login'));
        tabSignup.addEventListener('click', () => switchTab('signup'));

        // ===== LOGIN =====
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const senha = document.getElementById('loginSenha').value.trim();

            if (!email || !senha) {
                loginFeedback.textContent = '⚠️ Preencha e-mail/usuário e senha.';
                loginFeedback.className = 'feedback-message error';
                return;
            }

            loginFeedback.textContent = '✅ Login bem-sucedido! (demo)';
            loginFeedback.className = 'feedback-message success';
            setTimeout(() => {
                alert('👋 Bem-vindo ao Glith! (demo)');
            }, 300);
        });

        // ===== ESQUECEU A SENHA =====
        forgotBtn.addEventListener('click', function() {
            loginFeedback.textContent = '📧 Instruções de redefinição enviadas (demo)';
            loginFeedback.className = 'feedback-message info';
            setTimeout(() => {
                if (loginFeedback.textContent.includes('redefinição')) {
                    loginFeedback.textContent = '';
                    loginFeedback.className = 'feedback-message';
                }
            }, 3500);
        });

        // ===== CADASTRO com CAPTCHA =====
        signupForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const nome = document.getElementById('signupNome').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const senha = document.getElementById('signupSenha').value.trim();
            const captchaResposta = captchaInput.value.trim();

            // Validações
            if (!nome || !email || !senha) {
                signupFeedback.textContent = '⚠️ Preencha todos os campos.';
                signupFeedback.className = 'feedback-message error';
                return;
            }

            if (senha.length < 6) {
                signupFeedback.textContent = '⚠️ A senha deve ter pelo menos 6 caracteres.';
                signupFeedback.className = 'feedback-message error';
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                signupFeedback.textContent = '⚠️ Insira um e-mail válido.';
                signupFeedback.className = 'feedback-message error';
                return;
            }

            // Valida CAPTCHA
            if (!captchaResposta) {
                signupFeedback.textContent = '⚠️ Digite o resultado do CAPTCHA.';
                signupFeedback.className = 'feedback-message error';
                return;
            }

            if (parseInt(captchaResposta) !== captchaResult) {
                signupFeedback.textContent = '❌ CAPTCHA incorreto. Tente novamente.';
                signupFeedback.className = 'feedback-message error';
                generateCaptcha(); // renova
                return;
            }

            // Sucesso!
            signupFeedback.textContent = `✅ Conta criada com sucesso! Bem-vindo(a), ${nome}!`;
            signupFeedback.className = 'feedback-message success';

            // Desabilita botão e campos (simulação)
            signupBtn.disabled = true;
            document.querySelectorAll('#signupForm input').forEach(inp => inp.disabled = true);
            captchaRefresh.disabled = true;

            setTimeout(() => {
                alert('🎉 Cadastro concluído! (demo)');
                // Restaura para nova tentativa
                signupBtn.disabled = false;
                document.querySelectorAll('#signupForm input').forEach(inp => inp.disabled = false);
                captchaRefresh.disabled = false;
                signupForm.reset();
                generateCaptcha();
                signupFeedback.textContent = '';
                signupFeedback.className = 'feedback-message';
            }, 3000);
        });

        // ===== ATUALIZAR CAPTCHA =====
        captchaRefresh.addEventListener('click', generateCaptcha);

        // ===== ENTER no campo CAPTCHA envia o formulário =====
        captchaInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                signupForm.dispatchEvent(new Event('submit'));
            }
        });

        // ===== GERAR CAPTCHA INICIAL =====
        generateCaptcha();

        // ===== AO MUDAR PARA CADASTRO, gera novo CAPTCHA =====
        // Já fazemos no switchTab, mas garantimos
        const origSwitch = switchTab;
        switchTab = function(tab) {
            origSwitch(tab);
            if (tab === 'signup') {
                generateCaptcha();
            }
        };
        // Reatribui os listeners para usar a nova função
        tabLogin.removeEventListener('click', () => {});
        tabSignup.removeEventListener('click', () => {});
        tabLogin.addEventListener('click', () => switchTab('login'));
        tabSignup.addEventListener('click', () => switchTab('signup'));

        // Inicializa com login ativo
        switchTab('login');
    })();
</script>

</body>
</html>
